<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Задачи">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0F" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>Задачи</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
:root{
  --bg:#F5F4F1; --surface:#FFFFFF; --text:#17181B; --muted:#8A8B90; --faint:#C6C7CC;
  --line:rgba(23,24,27,.08); --accent:#2F6BFF; --accent-soft:rgba(47,107,255,.13);
  --grad:linear-gradient(135deg,#2F6BFF 0%,#1FA2FF 52%,#6A5CFF 100%);
  --danger:#D6402E; --shadow:0 12px 32px rgba(23,24,27,.12);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D0E10; --surface:#1A1B1E; --text:#F2F3F5; --muted:#8C8E95; --faint:#4A4C52;
    --line:rgba(255,255,255,.07); --accent:#4D82FF; --accent-soft:rgba(77,130,255,.2);
    --danger:#FF6B5B; --shadow:0 12px 32px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  touch-action:manipulation;overscroll-behavior-y:none;
}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}

.app{padding:calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 200px);max-width:620px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 4px}
h1{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.025em;margin:0}
.icon-btn{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center}
.icon-btn svg{width:26px;height:26px}

.group{margin-top:22px}
.group h2{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 6px 8px}
.group.overdue h2{color:var(--danger)}
.card{background:var(--surface);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;position:relative;padding:0 16px 0 4px;overflow:hidden;
  transition:opacity .25s ease,max-height .32s ease .08s}
.item + .item::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--line)}
.radio{flex:none;width:48px;height:54px;border:0;background:none;padding:0;display:grid;place-items:center}
.radio span{width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;transition:border-color .2s}
.radio span::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--grad);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.item.done .radio span{border-color:var(--accent)}
.item.done .radio span::after{transform:scale(1)}
.item.done .title{color:var(--muted)}
.item.leaving{opacity:0;max-height:0!important}
.item.enter{animation:enter 1.6s ease both}
@keyframes enter{0%{opacity:0;transform:translateY(-6px);background:var(--accent-soft)}30%{opacity:1;transform:none;background:var(--accent-soft)}100%{background:transparent}}
.body{flex:1;min-width:0;padding:12px 0 14px}
.title{font-size:17px;line-height:1.3;overflow-wrap:anywhere;transition:color .2s}
.tag{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:7px;padding:1px 8px 1px 7px;margin:0 0 5px;
  font-size:12px;font-weight:600;line-height:19px;position:relative;background:var(--tag-bg);color:var(--tag-fg)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag::after{content:"";position:absolute;inset:-10px -8px}
.tag.high{--tag-bg:rgba(214,58,40,.11);--tag-fg:#D33A28}
.tag.normal{--tag-bg:rgba(47,107,255,.1);--tag-fg:#2F6BFF}
.tag.low{--tag-bg:rgba(23,24,27,.06);--tag-fg:#8A8B90}
@media (prefers-color-scheme: dark){
  .tag.high{--tag-bg:rgba(255,107,91,.16);--tag-fg:#FF7B6B}
  .tag.normal{--tag-bg:rgba(77,130,255,.18);--tag-fg:#7FA6FF}
  .tag.low{--tag-bg:rgba(255,255,255,.07);--tag-fg:#8C8E95}
}

.empty{margin-top:22vh;text-align:center;color:var(--muted);padding:0 24px}
.empty i{font-style:normal;color:var(--text)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  padding:56px 18px calc(var(--safe-b) + 18px);
  background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 42%);
  display:flex;flex-direction:column;align-items:center}
.dock > *{pointer-events:auto;position:relative;z-index:1}

.bubble{width:100%;max-width:520px;background:var(--surface);border-radius:20px;padding:14px 44px 14px 16px;
  box-shadow:var(--shadow);margin-bottom:18px;
  opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;pointer-events:none}
.dock > .bubble{pointer-events:none}
.dock > .bubble.show{opacity:1;transform:none;pointer-events:auto}
.bubble .heard{color:var(--muted);font-size:14px;margin-bottom:4px}
.bubble .heard:empty{display:none}
.bubble .reply{font-size:16px;line-height:1.35;white-space:pre-line;overflow-wrap:anywhere}
.bubble .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center}
.bubble .x svg{width:16px;height:16px}

.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--text);color:var(--bg);
  display:grid;place-items:center;transition:transform .12s linear,background .25s,color .25s,box-shadow .3s}
.mic:active{transform:scale(.94)}
.mic svg{width:30px;height:30px;position:relative;z-index:2}
.mic .bg{position:absolute;inset:0;border-radius:50%;background:var(--grad);opacity:0;transition:opacity .25s;z-index:1}
.mic .wave{position:absolute;inset:0;border-radius:50%;background:var(--grad);opacity:0;pointer-events:none;z-index:0}
.mic .level{position:absolute;inset:-7px;border-radius:50%;background:var(--accent-soft);opacity:0;z-index:0;
  transform:scale(calc(1 + var(--lvl,0)*.32));transition:transform .1s linear,opacity .25s}
.mic .spin{position:absolute;inset:-7px;border-radius:50%;opacity:0;z-index:0;
  background:conic-gradient(from 0deg,rgba(47,107,255,0) 0 20%,#2F6BFF 55%,#1FA2FF 80%,#6A5CFF);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.mic.listening,.mic.speaking{color:#fff;box-shadow:0 8px 26px rgba(47,107,255,.4)}
.mic.listening .bg,.mic.speaking .bg{opacity:1}
.mic.listening .level{opacity:1}
.mic.listening .wave{animation:ripple 1.8s cubic-bezier(.2,.6,.35,1) infinite}
.mic.listening .wave + .wave{animation-delay:.9s}
.mic.speaking .wave{animation:ripple 2.6s ease-out infinite}
.mic.speaking .wave + .wave{animation-delay:1.3s}
.mic.thinking .spin{opacity:1;animation:spin .9s linear infinite}
@keyframes ripple{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.55);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);z-index:20;transform:translate(-50%,-30px);
  background:var(--text);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;
  display:flex;align-items:center;gap:12px;font-size:15px;max-width:calc(100% - 32px);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.1),opacity .2s,visibility 0s .3s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;
  box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.9,.3,1.1),opacity .2s}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;background:none;color:#7FA6FF;font-weight:600;padding:4px 8px;flex:none}
@media (prefers-color-scheme: dark){ .toast button{color:var(--accent)} }

.sheet-wrap{position:fixed;inset:0;z-index:30;visibility:hidden;transition:visibility 0s .3s}
.sheet-wrap.open{visibility:visible;transition:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .25s}
.sheet-wrap.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;background:var(--bg);
  border-radius:22px 22px 0 0;padding:10px 20px calc(var(--safe-b) + 20px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet-wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--faint);margin:0 auto 14px}
.sheet h3{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:14px;margin:0 0 16px}
.field{display:block;background:var(--surface);border-radius:14px;padding:10px 14px}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.field input{width:100%;border:0;background:none;color:var(--text);font-size:17px;padding:2px 0;outline:none;font-family:ui-monospace,Menlo,monospace}
.check{display:flex;align-items:center;gap:12px;margin:10px 0 18px}
.check .hint{margin:0}
.ghost{border:0;background:var(--surface);border-radius:12px;padding:9px 14px;font-size:15px;flex:none}
.switches{border-radius:14px;overflow:hidden}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);padding:12px 14px;font-size:16px}
.switch + .switch{border-top:1px solid var(--line)}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--faint);position:relative;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}
.primary{width:100%;border:0;border-radius:14px;background:var(--text);color:var(--bg);font-weight:600;padding:15px;margin-top:20px;font-size:17px}
.model{font-size:12px;color:var(--muted);margin-top:12px;text-align:center;white-space:pre-line;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="count">Задачи</h1>
    <button class="icon-btn" id="gear" aria-label="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>
  <main id="list"></main>
</div>

<div class="dock">
  <div class="bubble" id="bubble">
    <div class="heard" id="heard"></div>
    <div class="reply" id="reply"></div>
    <button class="x" id="bubbleClose" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <button class="mic" id="mic" aria-label="Говорить">
    <span class="wave"></span><span class="wave"></span><span class="level"></span><span class="spin"></span><span class="bg"></span>
    <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
  </button>
</div>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">Вернуть</button></div>

<div class="sheet-wrap" id="sheet">
  <div class="scrim" id="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <h3>Настройки</h3>
    <p class="hint">Ключ Gemini из Google AI Studio. Он хранится только на этом телефоне.</p>
    <label class="field"><span>Ключ API</span>
      <input id="keyInput" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="AIza…">
    </label>
    <div class="check"><button class="ghost" id="checkBtn">Проверить ключ</button><p class="hint" id="checkRes"></p></div>
    <div class="switches">
      <label class="switch"><span>Озвучивать вопросы</span><input type="checkbox" id="ttsToggle"></label>
      <label class="switch"><span>Сразу слушать ответ</span><input type="checkbox" id="alToggle"></label>
    </div>
    <button class="primary" id="saveBtn">Сохранить</button>
    <div class="model" id="modelLine"></div>
  </div>
</div>

<script>
'use strict';
/* ---------- storage ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const settings = Object.assign({ key:'', model:'', tts:true, autoListen:true }, LS.get('vt.settings', {}));
const saveSettings = () => LS.set('vt.settings', settings);
let tasks = LS.get('vt.tasks', []);
const saveTasks = () => LS.set('vt.tasks', tasks);

let pending = null;        // tasks waiting for a due date
let lastQuestion = null;
let phase = 'idle';
let speakToken = 0;
const freshIds = new Set();

const $ = s => document.querySelector(s);

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => isoOf(new Date());
const dayDiff = iso => Math.round((parseISO(iso) - parseISO(todayISO())) / 86400000);
const validISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseISO(s).getTime());
const fmtLong = new Intl.DateTimeFormat('ru-RU', { day:'numeric', month:'long' });
const fmtLongY = new Intl.DateTimeFormat('ru-RU', { day:'numeric', month:'long', year:'numeric' });
const fmtWd = new Intl.DateTimeFormat('ru-RU', { weekday:'long' });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const longDate = d => (d.getFullYear() !== new Date().getFullYear() ? fmtLongY : fmtLong).format(d).replace(/\s*г\.$/, '');

// Заголовок группы целиком описывает срок, поэтому у самих задач даты нет.
function groupOf(iso){
  if (!iso) return { key: '~none', label: 'Без срока', cls: 'none' };
  const n = dayDiff(iso), d = parseISO(iso);
  if (n < 0) return { key: iso, label: n === -1 ? 'Просрочено · вчера' : `Просрочено · ${longDate(d)}`, cls: 'overdue' };
  if (n === 0) return { key: iso, label: 'Сегодня', cls: 'today' };
  if (n === 1) return { key: iso, label: 'Завтра', cls: 'tomorrow' };
  return { key: iso, label: `${cap(fmtWd.format(d))}, ${longDate(d)}`, cls: 'later' };
}
const plural = (n, f) => { const a = n % 10, b = n % 100; return f[a === 1 && b !== 11 ? 0 : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 1 : 2]; };
const PRIO = { high: 'Важно', normal: 'Обычно', low: 'Потом' };
const PRIO_RANK = { high: 0, normal: 1, low: 2 };
const prioOf = p => PRIO[p] ? p : 'normal';
const NEXT_PRIO = { high: 'normal', normal: 'low', low: 'high' };
const nTasks = n => `${n} ${plural(n, ['задача','задачи','задач'])}`;

/* ---------- render ---------- */
function render(){
  const list = $('#list');
  list.innerHTML = '';
  $('#count').textContent = tasks.length ? nTasks(tasks.length) : 'Задач нет';
  if (!tasks.length){
    list.innerHTML = `<div class="empty">Нажми на микрофон и скажи, например:<br><i>«Купить продукты завтра»</i></div>`;
    return;
  }
  const groups = new Map();
  for (const t of tasks){
    const g = groupOf(t.due);
    if (!groups.has(g.key)) groups.set(g.key, Object.assign(g, { items: [] }));
    groups.get(g.key).items.push(t);
  }
  for (const k of [...groups.keys()].sort()){
    const g = groups.get(k);
    g.items.sort((a, b) => PRIO_RANK[prioOf(a.priority)] - PRIO_RANK[prioOf(b.priority)] || a.created - b.created);
    const sec = document.createElement('section');
    sec.className = 'group ' + g.cls;
    const h = document.createElement('h2'); h.textContent = g.label; sec.appendChild(h);
    const card = document.createElement('div'); card.className = 'card';
    for (const t of g.items) card.appendChild(itemEl(t));
    sec.appendChild(card);
    list.appendChild(sec);
  }
  freshIds.clear();
}
function itemEl(t){
  const el = document.createElement('div');
  el.className = 'item' + (freshIds.has(t.id) ? ' enter' : '');
  el.dataset.id = t.id;
  const btn = document.createElement('button');
  btn.className = 'radio'; btn.setAttribute('aria-label', 'Выполнено');
  btn.innerHTML = '<span></span>';
  btn.addEventListener('click', () => completeTasks([t], true));
  const body = document.createElement('div'); body.className = 'body';
  const p = prioOf(t.priority);
  const tag = document.createElement('button');
  tag.className = 'tag ' + p; tag.textContent = PRIO[p];
  tag.setAttribute('aria-label', 'Приоритет: ' + PRIO[p] + '. Нажми, чтобы сменить');
  tag.addEventListener('click', () => { t.priority = NEXT_PRIO[p]; saveTasks(); render(); });
  const title = document.createElement('div'); title.className = 'title'; title.textContent = t.title;
  body.append(tag, title);
  el.append(btn, body);
  return el;
}

/* ---------- task ops ---------- */
const newId = () => { let id; do { id = Math.random().toString(36).slice(2, 7); } while (tasks.some(t => t.id === id)); return id; };
function addTasks(list){
  for (const t of list){
    const id = newId();
    tasks.push({ id, title: t.title, due: t.due || null, priority: prioOf(t.priority), created: Date.now() });
    freshIds.add(id);
  }
  saveTasks(); render();
}
let lastRemoved = [];
function completeTasks(list, byTap){
  list = list.filter(t => tasks.includes(t));
  if (!list.length) return;
  const ids = new Set(list.map(t => t.id));
  for (const id of ids){
    const el = document.querySelector(`.item[data-id="${id}"]`);
    if (!el) continue;
    el.classList.add('done');
    setTimeout(() => { el.style.maxHeight = el.offsetHeight + 'px'; el.offsetHeight; el.classList.add('leaving'); }, byTap ? 420 : 250);
  }
  lastRemoved = list.slice();
  setTimeout(() => {
    tasks = tasks.filter(t => !ids.has(t.id));
    saveTasks(); render();
  }, byTap ? 820 : 650);
  toast(list.length === 1 ? `Готово: ${list[0].title}` : `Готово: ${nTasks(list.length)}`);
}
function undo(){
  for (const t of lastRemoved) if (!tasks.some(x => x.id === t.id)) tasks.push(t);
  lastRemoved = [];
  saveTasks(); render(); hideToast();
}

/* ---------- toast ---------- */
let toastTimer;
function toast(text){
  $('#toastText').textContent = text;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 4500);
}
function hideToast(){ $('#toast').classList.remove('show'); }
$('#toastUndo').addEventListener('click', undo);

/* ---------- bubble & phase ---------- */
let bubbleTimer;
function showBubble(heard, reply){
  $('#heard').textContent = heard ? `«${heard}»` : '';
  $('#reply').textContent = reply || '';
  $('#bubble').classList.add('show');
  clearTimeout(bubbleTimer);
  if (!pending) bubbleTimer = setTimeout(() => { if (phase === 'idle' && !pending) hideBubble(); }, 12000);
}
function hideBubble(){ $('#bubble').classList.remove('show'); }
$('#bubbleClose').addEventListener('click', () => {
  if (pending){ addTasks(pending); toast('Добавлено без срока'); pending = null; lastQuestion = null; }

/* ---------- recorder (PCM → WAV) ---------- */
const recorder = {
  ctx: null, stopFn: null,
  async record({ onStart, onLevel }){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      const e = new Error('unsupported'); e.name = 'NotSupportedError'; throw e;
    }
    if (!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC(); }
    const ctx = this.ctx;
    ctx.resume && ctx.resume().catch(() => {});
    const stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 } });
    if (ctx.state !== 'running'){ try{ await ctx.resume(); }catch(e){} }
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const mute = ctx.createGain(); mute.gain.value = 0;
    src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);

    const chunks = []; const t0 = performance.now();
    let speech = false, lastVoice = 0, floorSum = 0, floorN = 0, done = false, gotAudio = false;

    return new Promise(resolve => {
      const stop = reason => {
        if (done) return; done = true; this.stopFn = null;
        clearTimeout(watchdog);
        try{ proc.disconnect(); src.disconnect(); mute.disconnect(); }catch(e){}
        stream.getTracks().forEach(t => t.stop());
        if (reason === 'cancel') return resolve(null);
        if (reason === 'dead') return resolve({ dead:true });
        const total = chunks.reduce((a, c) => a + c.length, 0);
        if (reason === 'silence' || total < ctx.sampleRate * 0.5) return resolve({ empty:true });
        const merged = new Float32Array(total); let o = 0;
        for (const c of chunks){ merged.set(c, o); o += c.length; }
        const { data, rate } = downsample(merged, ctx.sampleRate, 16000);
        resolve({ wav: encodeWav(data, rate) });
      };
      this.stopFn = stop;
      const watchdog = setTimeout(() => { if (!gotAudio) stop('dead'); }, 2000);
      proc.onaudioprocess = e => {
        if (done) return;
        gotAudio = true;
        const d = e.inputBuffer.getChannelData(0);
        chunks.push(new Float32Array(d));
        let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
        const rms = Math.sqrt(s / d.length), now = performance.now(), el = now - t0;
        if (el < 200){ floorSum += rms; floorN++; }
        const floor = floorN ? floorSum / floorN : 0;
        const thr = Math.max(0.012, Math.min(floor, 0.03) * 2.5);
        if (el >= 200 && rms > thr){ speech = true; lastVoice = now; }
        onLevel && onLevel(Math.min(1, rms / 0.12));
        if (speech && now - lastVoice > 900) stop('end');
        else if (!speech && el > 8000) stop('silence');
        else if (el > 60000) stop('end');
      };
      onStart && onStart();
    });
  },
  finish(){ this.stopFn && this.stopFn('end'); },
  cancel(){ this.stopFn && this.stopFn('cancel'); }
};
function downsample(buf, from, to){
  if (from <= to) return { data: buf, rate: from };
  const ratio = from / to, len = Math.floor(buf.length / ratio), out = new Float32Array(len);
  for (let i = 0; i < len; i++){
    const a = Math.floor(i * ratio), b = Math.min(buf.length, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = a; j < b; j++) sum += buf[j];
    out[i] = b > a ? sum / (b - a) : 0;
  }
  return { data: out, rate: to };
}
function encodeWav(samples, rate){
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0, o = 44; i < samples.length; i++, o += 2){
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Uint8Array(buf);
}
function toBase64(u8){
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}

let voices = [];
const loadVoices = () => { try{ voices = speechSynthesis.getVoices() || []; }catch(e){} };
if (window.speechSynthesis){ loadVoices(); speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', loadVoices); }
const langOf = () => 'ru-RU';
function pickVoice(lang){
  const base = lang.slice(0, 2);
  const list = voices.filter(v => (v.lang || '').replace('_', '-').toLowerCase().startsWith(base));
  return list.find(v => /enhanced|premium|улучш/i.test(v.name)) || list[0] || null;
}
function speak(text){
  return new Promise(res => {
    if (!settings.tts || !window.speechSynthesis || !text) return res();
    let lang = langOf(text), voice = pickVoice(lang);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; if (voice) u.voice = voice; u.rate = 1.1;
    let finished = false;
    const end = () => { if (finished) return; finished = true; res(); };
    u.onend = end; u.onerror = end;
    setTimeout(end, 2500 + text.length * 90);
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  });
}
let unlocked = false;
function unlockAudio(){
  if (unlocked || !window.speechSynthesis) return;
  unlocked = true;
  try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){}
}

/* ---------- Gemini ---------- */
const API = 'https://generativelanguage.googleapis.com/v1beta';
const FALLBACK_MODELS = ['gemini-3.1-flash-lite', 'gemini-2.5-flash-lite', 'gemini-3.5-flash', 'gemini-3-flash-preview'];

const SYSTEM = `Ты ведёшь личный список задач голосом. Тебе приходит аудиозапись пользователя и контекст в JSON. Пользователь говорит в основном по-русски, иногда вставляя английские слова.

Язык записи:
- Пиши по-русски, кириллицей.
- Английские слова, которые пользователь произнёс по-английски, и всё, что обычно пишут латиницей (названия сервисов, приложений, брендов, компаний, технические термины, аббревиатуры: Figma, GitHub, Jira, Notion, Netflix, PR, API, deploy, onboarding), пиши латиницей в оригинальном написании. Не транслитерируй их («фигма» → Figma, «гитхаб» → GitHub).
- Если пользователь сказал всю фразу по-английски, пиши её по-английски.

Верни JSON:
- heard: что сказал пользователь, по тем же правилам языка.
- action: "add", "ask_due", "complete", "update" или "none".
- tasks: [{title, due, priority}]. title — коротко, с заглавной буквы, в форме действия, без даты и без «мне нужно» (пример: «Позвонить маме», «Обновить макеты в Figma»). due — "YYYY-MM-DD" или null. priority — "high", "normal" или "low".
- updates: [{id, priority, due, clear_due}] — изменения существующих задач для "update" (указывай только то, что меняется; clear_due = true, если срок нужно убрать).
- complete_ids: id из current_tasks, которые пользователь сделал или просит убрать.
- reply: одна короткая фраза по-русски для озвучки, без эмодзи и разметки. Для "add", "complete" и "update" — пустая строка.

Правила:
1. Новая задача со сроком → "add". Если пользователь прямо сказал, что срока нет («без срока», «когда-нибудь») → "add" с due = null.
2. pending = null и у какой-то новой задачи срок не назван → "ask_due" со всеми новыми задачами (где срок известен, due заполнен); reply — короткий вопрос, например «Когда нужно позвонить маме?».
3. pending не null → это ответ про срок: "add" для задач из pending с проставленным due. «Не знаю», «без срока» или непонятно → due = null. Если вместо ответа надиктованы новые задачи — "add" и pending (due = null), и новых. Дважды не спрашивай.
4. Пользователь говорит, что сделал задачу, или просит её убрать → "complete" с подходящими id.
5. Непонятно или не про задачи → "none" с короткой репликой.
6. Приоритет: "high", если звучит «важно», «срочно», «обязательно», «горит», «в первую очередь»; "low", если «не срочно», «не горит», «когда будет время», «не важно», «если успею»; иначе "normal". Про приоритет не переспрашивай.
7. Пользователь просит поменять существующую задачу («сделай звонок маме важным», «перенеси отчёт на понедельник», «убери срок у фотографий») → "update" с id из current_tasks.
8. Даты считай от today (день недели указан): «в пятницу» — ближайшая будущая пятница (если сегодня пятница — сегодня); «на этой неделе», «до конца недели» — ближайшее воскресенье; «на следующей неделе» — воскресенье следующей недели; «через N дней» — today + N; «в конце месяца» — последний день месяца; «в течение месяца» — today + 30. Приблизительные сроки округляй до конкретной даты.`;

const SCHEMA = {
  type: 'OBJECT',
  properties: {
    heard: { type: 'STRING' },
    action: { type: 'STRING' },
    updates: { type: 'ARRAY', items: { type: 'OBJECT', properties: { id: { type: 'STRING' }, priority: { type: 'STRING', nullable: true }, due: { type: 'STRING', nullable: true }, clear_due: { type: 'BOOLEAN', nullable: true } }, required: ['id'] } },
    tasks: { type: 'ARRAY', items: { type: 'OBJECT', properties: { title: { type: 'STRING' }, due: { type: 'STRING', nullable: true }, priority: { type: 'STRING' } }, required: ['title'] } },
    complete_ids: { type: 'ARRAY', items: { type: 'STRING' } },
    reply: { type: 'STRING' }
  },
  required: ['heard', 'action', 'reply']
};

async function apiError(r){
  let msg = '';
  try{ const j = await r.json(); msg = (j.error && j.error.message) || ''; }catch(e){}
  const e = new Error(msg || 'HTTP ' + r.status); e.status = r.status; return e;
}
const isKeyError = e => e.status === 403 || (e.status === 400 && /api.?key/i.test(e.message));
function keyErr(){ const e = new Error('bad key'); e.userMessage = 'Ключ не подошёл. Проверь его в настройках.'; e.key = true; return e; }

async function discoverModels(key){
  const r = await fetch(`${API}/models?pageSize=1000&key=${encodeURIComponent(key)}`);
  if (!r.ok) throw await apiError(r);
  const j = await r.json();
  const names = (j.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''))
    .filter(n => /^gemini-.*flash/.test(n) && !/(image|tts|live|audio|embed|robotics|computer|thinking|exp|8b)/.test(n));
  const score = n => {
    const m = n.match(/^gemini-(\d+(?:\.\d+)?)/);
    let s = (m ? parseFloat(m[1]) : 0) * 100;
    if (/lite/.test(n)) s += 500;
    if (/preview/.test(n)) s -= 25;
    if (/-\d{3}$/.test(n)) s -= 5;
    return s;
  };
  return names.sort((a, b) => score(b) - score(a));
}

function thinkingSteps(m){
  if (/^gemini-[3-9]/.test(m)) return [{ thinkingLevel: 'minimal' }, { thinkingLevel: 'low' }, null];
  if (/^gemini-2\.5/.test(m)) return [{ thinkingBudget: 0 }, null];
  return [null];
}
async function callModel(m, key, body, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try{
    return await fetch(`${API}/models/${m}:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctrl.signal
    });
  } finally { clearTimeout(timer); }
}

async function generate(body, opts = {}){
  const key = opts.key || settings.key;
  const timeoutMs = opts.timeout || 25000;
  let models = LS.get('vt.models', null);
  if (!models || !models.length){
    try{ models = await discoverModels(key); LS.set('vt.models', models); }
    catch(e){ if (isKeyError(e)) throw keyErr(); models = []; }
  }
  const cands = [...new Set([settings.model, ...models, ...FALLBACK_MODELS].filter(Boolean))].slice(0, 4);
  const log = [];
  let rateLimited = false, last = null;
  for (const m of cands){
    const steps = thinkingSteps(m);
    for (let si = 0; si < steps.length; si++){
      const think = steps[si];
      const b = JSON.parse(JSON.stringify(body));
      if (think) b.generationConfig = Object.assign({}, b.generationConfig, { thinkingConfig: think });
      const t0 = performance.now();
      let r;
      try{ r = await callModel(m, key, b, timeoutMs); }
      catch(e){
        const what = e.name === 'AbortError' ? `нет ответа за ${Math.round(timeoutMs / 1000)} с` : `сеть: ${e.message}`;
        log.push(`${m}: ${what}`);
        last = e; break;
      }
      if (r.ok){
        if (settings.model !== m){ settings.model = m; saveSettings(); }
        const j = await r.json();
        j._model = m; j._ms = Math.round(performance.now() - t0);
        return j;
      }
      last = await apiError(r);
      if (isKeyError(last)) throw keyErr();
      if (think && r.status === 400 && /thinking/i.test(last.message) && si < steps.length - 1) continue;
      log.push(`${m}: ${last.status} ${last.message.slice(0, 90)}`);
      if (last.status === 404 || /not found|not supported|deprecat/i.test(last.message)){
        if (settings.model === m){ settings.model = ''; saveSettings(); }
      } else if (last.status === 429) rateLimited = true;
      else if (last.status < 500){ const e = new Error(last.message); e.userMessage = 'Gemini вернул ошибку:\n' + log.join('\n'); throw e; }
      break;
    }
  }
  const e = new Error('failed');
  e.userMessage = (rateLimited ? 'Лимит бесплатных запросов исчерпан. Попробуй чуть позже.' : 'Не получилось достучаться до Gemini.') + '\n' + log.join('\n');
  throw e;
}

async function askGemini(wav){
  const t = new Date();
  const ctx = {
    today: todayISO(),
    weekday: fmtWd.format(t),
    current_tasks: tasks.map(x => ({ id: x.id, title: x.title, due: x.due, priority: prioOf(x.priority) })),
    pending: pending,
    last_question: lastQuestion
  };
  const body = {
    systemInstruction: { parts: [{ text: SYSTEM }] },
    contents: [{ role: 'user', parts: [
      { inlineData: { mimeType: 'audio/wav', data: toBase64(wav) } },
      { text: 'Контекст: ' + JSON.stringify(ctx) }
    ] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: SCHEMA, temperature: 0.2 }
  };
  const j = await generate(body);
  const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
  const text = parts.filter(p => p.text && !p.thought).map(p => p.text).join('');
  try{ return JSON.parse(text); }
  catch(e){
    const m = text.match(/\{[\s\S]*\}/);
    if (m) return JSON.parse(m[0]);
    const x = new Error('parse'); x.userMessage = 'Не получилось разобрать ответ. Попробуй ещё раз.'; throw x;
  }
}

/* ---------- main flow ---------- */
async function handle(r){
  const action = r.action;
  let reply = (r.reply || '').trim();
  const list = (r.tasks || [])
    .filter(t => t && typeof t.title === 'string' && t.title.trim())
    .map(t => ({ title: t.title.trim(), due: validISO(t.due) ? t.due : null, priority: prioOf(t.priority) }));
  const hadPending = !!pending;

  // Добавление и отметка проходят молча: подтверждение видно в самом списке.
  if (action === 'add' && list.length){
    addTasks(list); pending = null; lastQuestion = null;
    hideBubble(); setPhase('idle'); return;
  }
  if (action === 'ask_due' && list.length && hadPending){
    addTasks(list); pending = null; lastQuestion = null;
    hideBubble(); setPhase('idle'); return;
  }
  if (action === 'update'){
    let n = 0;
    for (const u of (r.updates || [])){
      const t = tasks.find(x => x.id === u.id);
      if (!t) continue;
      if (PRIO[u.priority]) t.priority = u.priority;
      if (validISO(u.due)) t.due = u.due;
      else if (u.clear_due) t.due = null;
      freshIds.add(t.id); n++;
    }
    pending = null; lastQuestion = null;
    if (n){ saveTasks(); render(); hideBubble(); setPhase('idle'); return; }
    reply = 'Не нашёл такую задачу.';
  } else if (action === 'complete'){
    const ids = r.complete_ids || [];
    const found = tasks.filter(t => ids.includes(t.id));
    pending = null; lastQuestion = null;
    if (found.length){ completeTasks(found, false); hideBubble(); setPhase('idle'); return; }
    reply = 'Не нашёл такую задачу.';
  } else if (action === 'ask_due' && list.length){
    pending = list; lastQuestion = reply || 'Когда нужно сделать?'; reply = lastQuestion;
  } else if (!reply){
    reply = 'Не расслышал. Попробуй ещё раз.';
  }

  showBubble(r.heard, reply);
  const token = ++speakToken;
  setPhase(settings.tts ? 'speaking' : 'idle');
  await speak(reply);
  if (token !== speakToken || phase !== (settings.tts ? 'speaking' : 'idle')) return;
  setPhase('idle');
  if (pending && settings.autoListen) startListening(true);
}

function micErrorText(e){
  if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError'))
    return 'Нет доступа к микрофону. Разреши его: Настройки → Safari → Микрофон.';
  if (e && e.name === 'NotSupportedError')
    return 'Микрофон недоступен. Открой приложение по ссылке https.';
  return 'Не удалось включить микрофон.';
}

async function startListening(auto){
  let audio;
  try{
    audio = await recorder.record({ onStart: () => setPhase('listening'), onLevel: setLevel });
  }catch(e){
    setPhase('idle');
    if (!auto) showBubble(null, micErrorText(e));
    return;
  }
  if (!audio){ setPhase('idle'); return; }
  if (audio.dead){ setPhase('idle'); if (!auto) showBubble(null, 'Микрофон не отвечает. Нажми ещё раз.'); return; }
  if (audio.empty){
    setPhase('idle');
    showBubble(null, pending ? (lastQuestion || 'Когда нужно сделать?') : 'Не расслышал. Попробуй ещё раз.');
    return;
  }
  setPhase('thinking');
  try{
    const r = await askGemini(audio.wav);
    await handle(r);
  }catch(e){
    setPhase('idle');
    showBubble(null, e.userMessage || ('Ошибка: ' + e.message));
    if (e.key) openSettings();
  }
}

$('#mic').addEventListener('click', () => {
  unlockAudio();
  if (phase === 'listening'){ recorder.finish(); return; }
  if (phase === 'speaking'){ speakToken++; window.speechSynthesis && speechSynthesis.cancel(); setPhase('idle'); return; }
  if (phase === 'thinking') return;
  if (!settings.key){ openSettings(); return; }
  hideToast();
  startListening(false);
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    recorder.cancel(); speakToken++;
    window.speechSynthesis && speechSynthesis.cancel();
    if (phase !== 'thinking') setPhase('idle');
  } else render();
});

/* ---------- settings ---------- */
function openSettings(){
  $('#keyInput').value = settings.key;
  $('#ttsToggle').checked = settings.tts;
  $('#alToggle').checked = settings.autoListen;
  $('#checkRes').textContent = '';
  $('#modelLine').textContent = settings.model ? 'Модель: ' + settings.model : '';
  $('#sheet').classList.add('open');
  if (!settings.key) setTimeout(() => $('#keyInput').focus(), 320);
}
function closeSettings(){ $('#keyInput').blur(); $('#sheet').classList.remove('open'); }
$('#gear').addEventListener('click', openSettings);
$('#scrim').addEventListener('click', closeSettings);
$('#saveBtn').addEventListener('click', () => {
  const key = $('#keyInput').value.trim();
  if (key !== settings.key){ settings.key = key; settings.model = ''; LS.set('vt.models', null); }
  settings.tts = $('#ttsToggle').checked;
  settings.autoListen = $('#alToggle').checked;
  saveSettings(); closeSettings(); setPhase(phase);
});
$('#checkBtn').addEventListener('click', async () => {
  const key = $('#keyInput').value.trim();
  const res = $('#checkRes');
  if (!key){ res.textContent = 'Сначала вставь ключ'; return; }
  res.textContent = 'Проверяю…';
  try{
    const models = await discoverModels(key);
    LS.set('vt.models', models);
    if (key !== settings.key){ settings.model = ''; }
    res.textContent = 'Ключ работает. Пробую модель…';
    const j = await generate({ contents: [{ role: 'user', parts: [{ text: 'Ответь одним словом: ок' }] }] }, { key, timeout: 20000 });
    res.textContent = `Всё работает ✓ (${(j._ms / 1000).toFixed(1)} с)`;
    $('#modelLine').textContent = 'Модель: ' + j._model;
  }catch(e){
    if (e.key) res.textContent = 'Ключ не подошёл';
    else if (e.userMessage) { res.textContent = 'Модель не отвечает'; $('#modelLine').textContent = e.userMessage; }
    else res.textContent = e.status ? 'Ошибка: ' + e.message : 'Нет связи: ' + e.message;
  }
});

/* ---------- home screen icon ---------- */
render();
setPhase('idle');
if (!settings.key) setTimeout(openSettings, 400);
</script>
</body>
</html>
